# The macOS build of this fork: an app for Apple Silicon and Intel, built on
# GitHub's runner because nobody maintaining the fork has a Mac. The app is
# untested; docs/MACOS-PORT.md says what is known and how to help.
#
# It runs when started by hand, on a push to the macos-build branch, and on a
# pull request. Release packages take the app job's zip unchanged, checked
# against the sha256 the job prints.
name: macOS build

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "GitHub's macOS runner image (the default when started any other way: macos-15-intel)"
        default: macos-15-intel
  push:
    branches:
      - macos-build
  pull_request:

permissions:
  contents: read

# The first two runs (2026-10-29) on macos-14, Apple Silicon, were never given
# a runner: "not acquired ... even after multiple attempts", under GitHub's
# notice of arm64 capacity constraints. The Intel image builds the same
# universal app (Xcode builds the arm64 slice there too); the C suite then
# runs as x86_64. A run started by hand can name another image.

defaults:
  run:
    shell: bash

jobs:
  app:
    name: App (universal, Release)
    runs-on: ${{ inputs.runner || 'macos-15-intel' }}

    steps:
      - name: Clone
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0

      - name: Cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5.1.0
        with:
          path: out/build/macos
          # One cache per runner image: an Apple Silicon run that restored an
          # Intel run's CMakeCache.txt (key v1, shared) found Intel Homebrew's
          # git at /usr/local/bin and failed to configure (run 41249431579).
          # A hit is never saved again, so the key names what the cached
          # third-party build depends on (review 2026-10-31, finding 19).
          key: macos-release-cmake-v3-${{ inputs.runner || 'macos-15-intel' }}-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', '**/CMakeLists.txt', 'cmake/**', 'third_party/**') }}

      - name: Configure
        run: cmake --preset macos

      - name: Build
        run: cmake --build --preset macos-release

      # The app's and its executable's names come from the bundle itself
      # (CMakeLists.txt sets OUTPUT_NAME and Xcode's EXECUTABLE_NAME apart).
      - name: Locate the app
        run: |
          app="$(find out/build/macos/Release -maxdepth 1 -name '*.app' -type d | head -1)"
          [ -n "$app" ] || { echo "::error::no app under out/build/macos/Release"; exit 1; }
          exe="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")"
          echo "app: $app"; echo "executable: $exe"
          echo "APP=$app" >> "$GITHUB_ENV"
          echo "BIN=$app/Contents/MacOS/$exe" >> "$GITHUB_ENV"

      # An arm64 binary must carry a signature to run at all. Ad-hoc only: the
      # app is not notarized (an Apple Developer certificate names a person).
      - name: Sign (ad hoc)
        run: |
          codesign --force --deep -s - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      # Starts the executable: `-features` prints the build's switches and
      # exits before any window, sound or game data (main.c), so this proves
      # only that the binary loads and runs. The runner's own slice, and the
      # Intel one under Rosetta on Apple Silicon (review 2026-10-31,
      # finding 19).
      - name: Start the binary
        run: |
          runs=("")
          if [ "$(uname -m)" = arm64 ] && arch -x86_64 /usr/bin/true 2>/dev/null; then runs+=("arch -x86_64"); fi
          for prefix in "${runs[@]}"; do
            out="$($prefix "$BIN" -features)"
            first="$(head -1 <<< "$out")"
            echo "${prefix:-native}: $first, $(($(wc -l <<< "$out") - 1)) switches"
            [ "$first" = "schema 1" ] || { echo "::error::${prefix:-native}: -features printed '$first'"; exit 1; }
          done

      # Opens the window: a game folder holding only a one-entry tig.dat gets
      # the engine past the file layer to SDL's window and renderer, which it
      # names ("TIG Video: Using 'opengl' driver"); it then stops at the mouse
      # module for want of cursor art. No game data is involved. The archive
      # is laid out as tests/test_mod_format_bounds.c writes one.
      - name: Open the window
        run: |
          game="$RUNNER_TEMP/ce-game"
          mkdir -p "$game"
          python3 - "$game/tig.dat" <<'PY'
          import struct, sys
          # Payload size 0 and one empty entry; then the footer: fourcc,
          # name-table size, and the table less its first word plus 12.
          name = b"readme\0"
          table = struct.pack("<iii", 0, 1, len(name)) + name + bytes(4) + struct.pack("<iiii", 0, 0, 0, 0)
          open(sys.argv[1], "wb").write(table + b" TAD" + struct.pack("<ii", 16, len(table) - 4 + 12))
          PY
          runs=("")
          if [ "$(uname -m)" = arm64 ] && arch -x86_64 /usr/bin/true 2>/dev/null; then runs+=("arch -x86_64"); fi
          for prefix in "${runs[@]}"; do
            out="$(cd "$game" && ARCANUM_CE_GAME_DIR="$game" $prefix "$BIN" -window 2>&1 || true)"
            printf '%s\n' "$out" | grep -E "TIG (File|Video)|Error initializing" | sed "s/^/${prefix:-native}: /"
            grep -q "TIG Video: Using '" <<< "$out" || { echo "::error::${prefix:-native}: no window or renderer was created"; exit 1; }
          done

      - name: Check the binary
        run: |
          bin="$BIN"
          archs="$(lipo -archs "$bin")"
          echo "architectures: $archs"
          case " $archs " in *" x86_64 "*) ;; *) echo "::error::no x86_64 slice"; exit 1 ;; esac
          case " $archs " in *" arm64 "*) ;; *) echo "::error::no arm64 slice"; exit 1 ;; esac
          otool -L "$bin"
          # A universal binary prints one header per slice; the libraries are the indented lines.
          if otool -L "$bin" | grep -E '^[[:space:]]' | grep -v -E '^[[:space:]]+(/usr/lib/|/System/Library/)'; then
            echo "::error::links a library outside the system"; exit 1
          fi
          if strings "$bin" | grep -E '/Users/|/home/'; then
            echo "::error::a home path in the binary"; exit 1
          fi

      # upload-artifact drops permissions and symlinks from loose files, so the
      # bundle travels only inside ditto's zip.
      - name: Zip
        run: |
          cd "$(dirname "$APP")"
          ditto -c -k --keepParent "$(basename "$APP")" "$GITHUB_WORKSPACE/arcanum-ce-macos.zip"
          cd "$GITHUB_WORKSPACE"
          shasum -a 256 arcanum-ce-macos.zip | tee arcanum-ce-macos.zip.sha256

      - name: Upload
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: arcanum-ce-macos
          path: |
            arcanum-ce-macos.zip
            arcanum-ce-macos.zip.sha256
          retention-days: 30

  tests:
    name: C suite (Apple clang)
    runs-on: ${{ inputs.runner || 'macos-15-intel' }}

    steps:
      - name: Clone
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0

      # A single-config generator (the preset's Xcode generator is
      # multi-config). ARCANUM_TESTS_GNU_LINK is off on Apple: the tests that
      # need GNU objcopy or ld --wrap are left out (tests/CMakeLists.txt).
      - name: Configure
        run: cmake -S . -B out/build/mac-tests -DCMAKE_BUILD_TYPE=Debug -DARCANUM_BUILD_TESTS=ON

      - name: Build
        run: cmake --build out/build/mac-tests --target arcanum-tests -j "$(sysctl -n hw.ncpu)"

      - name: Unit tests
        working-directory: out/build/mac-tests/tests
        run: ./arcanum-tests

  # The two unpackers setup.sh needs, so a Mac player needs no package
  # manager (Homebrew refuses Intel Macs since 2026-09): gogx for GOG's
  # installer (tools/gogx, Rust) and 7-Zip's 7zz for UAP's (tools/7zip, from
  # 7-Zip's source, since its prebuilt Intel slice needs macOS 10.15). Both
  # universal, ad-hoc signed, for macOS 10.13 (Intel) and 11.0 (Apple
  # Silicon). The release package takes this job's zip unchanged, checked
  # against the sha256 it prints.
  tools:
    name: Setup tools (gogx, 7zz)
    runs-on: ${{ inputs.runner || 'macos-15-intel' }}

    steps:
      - name: Clone
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0

      # The toolchain and both Mac targets named in tools/gogx/rust-toolchain.toml.
      - name: Rust
        run: |
          # GitHub's macOS images carry rustup; a runner without it stops here
          # rather than running a script fetched from the network.
          command -v rustup >/dev/null || [ -x "$HOME/.cargo/bin/rustup" ] || { echo "::error::rustup is not on this runner"; exit 1; }
          export PATH="$HOME/.cargo/bin:$PATH"
          channel="$(sed -n 's/^channel = "\(.*\)"$/\1/p' tools/gogx/rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal --target x86_64-apple-darwin,aarch64-apple-darwin
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustc +"$channel" --version

      - name: Build gogx
        run: tools/gogx/build.sh --mac

      - name: Test gogx
        working-directory: tools/gogx
        run: cargo test --release --locked

      - name: Build 7zz
        run: tools/7zip/build.sh

      # The app job's checks, plus the oldest macOS each slice accepts:
      # LC_BUILD_VERSION's minos, or LC_VERSION_MIN_MACOSX's version, which
      # the linker writes for targets before 10.14.
      - name: Check the binaries
        run: |
          fail=0
          for bin in tools/gogx/target/gogx tools/7zip/build/7zz; do
            echo "== $bin"
            archs="$(lipo -archs "$bin")"; echo "architectures: $archs"
            case " $archs " in *" x86_64 "*) ;; *) echo "::error::$bin has no x86_64 slice"; fail=1 ;; esac
            case " $archs " in *" arm64 "*) ;; *) echo "::error::$bin has no arm64 slice"; fail=1 ;; esac
            codesign --verify --strict --verbose=2 "$bin" || fail=1
            otool -L "$bin"
            if otool -L "$bin" | grep -E '^[[:space:]]' | grep -v -E '^[[:space:]]+(/usr/lib/|/System/Library/)'; then
              echo "::error::$bin links a library outside the system"; fail=1
            fi
            if strings "$bin" | grep -E '/Users/|/home/'; then
              echo "::error::a home path in $bin"; fail=1
            fi
            for pair in x86_64:10.13 arm64:11.0; do
              arch="${pair%%:*}"; want="${pair#*:}"
              # Captured first: awk stopping early would cut otool off (SIGPIPE).
              commands="$(otool -arch "$arch" -l "$bin")"
              got="$(awk '/cmd LC_BUILD_VERSION/{b=1} /cmd LC_VERSION_MIN_MACOSX/{v=1} !found&&b&&$1=="minos"{found=$2} !found&&v&&$1=="version"{found=$2} END{print found}' <<< "$commands")"
              echo "$arch: macOS $got and later"
              [ "${got%.0}" = "${want%.0}" ] || { echo "::error::$bin's $arch slice targets macOS $got, not $want"; fail=1; }
            done
          done
          exit "$fail"

      # Run on this runner's own architecture (x86_64 on macos-15-intel), and
      # the Intel slice under Rosetta as well when the runner is Apple
      # Silicon and Rosetta is there. Pinned inputs: Inno Setup's own 6.4.3
      # installer for gogx, and Notepad++ 8.9.7's NSIS installer (solid LZMA,
      # as UAP's is) for 7zz.
      - name: Smoke test
        run: |
          mkdir -p smoke && cd smoke
          curl -fsSL --retry 3 -o inno.exe https://github.com/jrsoftware/issrc/releases/download/is-6_4_3/innosetup-6.4.3.exe
          echo "f3c42116542c4cc57263c5ba6c4feabfc49fe771f2f98a79d2f7628b8762723b  inno.exe" | shasum -a 256 -c -
          curl -fsSL --retry 3 -o nsis.exe https://github.com/notepad-plus-plus/notepad-plus-plus/releases/download/v8.9.7/npp.8.9.7.Installer.x64.exe
          echo "1884e093bae261c4942210334e1f2eae71354913e4ded3cc1a4a18c5320741ec  nsis.exe" | shasum -a 256 -c -
          gogx="$GITHUB_WORKSPACE/tools/gogx/target/gogx"
          sevenzz="$GITHUB_WORKSPACE/tools/7zip/build/7zz"
          runs=("")
          if [ "$(uname -m)" = arm64 ] && arch -x86_64 /usr/bin/true 2>/dev/null; then runs+=("arch -x86_64"); fi
          for prefix in "${runs[@]}"; do
            echo "== ${prefix:-native}"
            $prefix "$gogx" --version
            $prefix "$gogx" --test inno.exe
            rm -rf inno && $prefix "$gogx" inno.exe inno
            n="$(find inno -type f | wc -l | tr -d ' ')"
            [ "$n" = 101 ] || { echo "::error::gogx wrote $n files from Inno Setup 6.4.3's installer, not 101"; exit 1; }
            formats="$($prefix "$sevenzz" i)"
            grep -qw Nsis <<< "$formats" || { echo "::error::7zz has no NSIS handler"; exit 1; }
            $prefix "$sevenzz" t -bd nsis.exe
            rm -rf nsis && $prefix "$sevenzz" x -y -bd -onsis nsis.exe > /dev/null
            n="$(find nsis -type f | wc -l | tr -d ' ')"
            [ "$n" -ge 250 ] || { echo "::error::7zz unpacked $n files from the NSIS installer"; exit 1; }
          done

      # gogx's crates' licence notices, 7-Zip's licence and unRAR's
      # restriction, and what each binary was built from.
      - name: Zip
        run: |
          rm -rf stage && mkdir -p stage/tools
          cp tools/gogx/target/gogx tools/7zip/build/7zz stage/tools/
          {
            echo "# gogx"; echo
            (cd tools/gogx && python3 licenses.py)
            echo; echo "# 7-Zip (7zz)"; echo
            cat tools/7zip/build/License.txt
            echo; cat tools/7zip/build/unRarLicense.txt
          } > stage/tools/NOTICES.txt
          {
            echo "gogx: Arcanum CE's tools/gogx at $GITHUB_SHA, $(cd tools/gogx && rustc --version), with innospect 0.2.0 and tools/gogx/patches/."
            cat tools/7zip/build/SOURCE.txt
            echo "Both built on $(sw_vers -productName) $(sw_vers -productVersion), $(xcodebuild -version | head -1)."
          } > stage/tools/SOURCES.txt
          cat stage/tools/SOURCES.txt
          (cd stage && ditto -c -k --norsrc --noextattr --noacl --keepParent tools "$GITHUB_WORKSPACE/arcanum-ce-macos-tools.zip")
          shasum -a 256 arcanum-ce-macos-tools.zip | tee arcanum-ce-macos-tools.zip.sha256

      - name: Upload
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: arcanum-ce-macos-tools
          path: |
            arcanum-ce-macos-tools.zip
            arcanum-ce-macos-tools.zip.sha256
          retention-days: 30
